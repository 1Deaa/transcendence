# ------------------------------------------------------------------------------
#  HrmSystem client container — serves the published Blazor WASM app and
#  reverse-proxies the API + SignalR hubs so the browser sees ONE origin.
# ------------------------------------------------------------------------------

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Precompressed WASM/framework payloads (Blazor publish emits .br/.gz next to originals).
    gzip            on;
    gzip_types      application/octet-stream application/wasm application/javascript text/css application/json;
    gzip_min_length 1024;

    # ---- REST API ------------------------------------------------------------
    location /api/ {
        proxy_pass         http://hrmsystem.api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Health endpoints proxied too so the status page (and ops) work same-origin.
    location /health {
        proxy_pass         http://hrmsystem.api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---- SignalR hubs (WebSockets) --------------------------------------------
    location /hubs/ {
        proxy_pass         http://hrmsystem.api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 100s;
    }

    # ---- Blazor WASM SPA -------------------------------------------------------
    # Immutable fingerprinted framework assets can cache forever.
    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (deep links like /employees) fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
