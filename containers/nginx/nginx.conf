# ------------------------------------------------------------------------------
#  HrmSystem client container — serves the published Blazor WASM app over HTTPS
#  and reverse-proxies the API + SignalR hubs so the browser sees ONE origin.
#  TLS terminates here; traffic to the API container stays on the internal
#  Docker network as plain HTTP.
# ------------------------------------------------------------------------------

# WebSocket-aware Connection header: "upgrade" during the handshake, "" (drop the
# header) for plain requests — safer than hardcoding "upgrade" for every request.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Plain HTTP → permanent redirect to the HTTPS origin (host port 5100 → 443).
server {
    listen       80;
    server_name  _;
    return 301 https://$host:5100$request_uri;
}

server {
    listen       443 ssl;
    http2        on;
    server_name  _;

    # Self-signed certificate generated at image build time (see the client Dockerfile).
    ssl_certificate     /etc/nginx/certs/hrmsystem.crt;
    ssl_certificate_key /etc/nginx/certs/hrmsystem.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /usr/share/nginx/html;
    index index.html;

    # Precompressed WASM/framework payloads (Blazor publish emits .br/.gz next to originals).
    gzip            on;
    gzip_types      application/octet-stream application/wasm application/javascript text/css application/json;
    gzip_min_length 1024;

    # ---- REST API ------------------------------------------------------------
    location /api/ {
        proxy_pass         http://hrmsystem.api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Health endpoints proxied too so the status page (and ops) work same-origin.
    location /health {
        proxy_pass         http://hrmsystem.api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---- SignalR hubs (WebSockets + SSE/long-polling fallback) ----------------
    location /hubs/ {
        proxy_pass         http://hrmsystem.api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Buffering must be off or Server-Sent Events (the non-WebSocket fallback) stall.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---- Blazor WASM SPA -------------------------------------------------------
    # Immutable fingerprinted framework assets can cache forever.
    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (deep links like /employees) fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
