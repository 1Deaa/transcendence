name: hrmsystem

# ------------------------------------------------------------------------------
#  HrmSystem — Docker Compose (Phase 1)
#  Services:
#    hrmsystem.sqlserver  → SQL Server 2022 (data + backups volumes, healthcheck)
#    hrmsystem.redis      → Redis cache
#    hrmsystem.seq        → Seq log/trace sink (OTLP ingest on 5341)
#  The API (hrmsystem.api) and Blazor client (hrmsystem.client) services are added
#  in the containerization step — run the API from the IDE/CLI against these until then.
# ------------------------------------------------------------------------------

services:
  hrmsystem.sqlserver:
    container_name: hrmsystem.sqlserver
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Sa123456789!"
      MSSQL_PID: "Developer"
    ports:
      - "14330:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      #! The DR-critical volume — DatabaseBackupJob writes .bak files here (shared with the API).
      - sqlserver_backups:/var/backups
    healthcheck:
      #! -C trusts the self-signed certificate inside the container (mssql-tools18 enforces TLS).
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Sa123456789!" -Q "SELECT 1" -b -C
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  hrmsystem.redis:
    container_name: hrmsystem.redis
    image: redis:latest
    ports:
      - "63790:6379"

  hrmsystem.seq:
    container_name: hrmsystem.seq
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
    ports:
      #? UI on http://localhost:8081 — OTLP ingest (traces/logs from the API) on 5341.
      - "8082:80"
      - "5342:5341"
    volumes:
      - seq_data:/data

volumes:
  sqlserver_data:
  #! Named volume so backups survive container recreation — see docs/disaster-recovery-runbook.md.
  sqlserver_backups:
  seq_data:
