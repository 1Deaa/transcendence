<!DOCTYPE html>
<html lang="en" class="layout-navbar-fixed layout-menu-fixed" data-assets-path="assets/" data-template="vertical-menu-template">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HrmSystem</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="icon" type="image/x-icon" href="assets/img/favicon/favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet" />

    <!-- Vuexy vendor + theme (subset ported from Helpers/vuexy-bootstrap-html-admin-template) -->
    <link rel="stylesheet" href="assets/vendor/fonts/tabler-icons.css" />
    <link rel="stylesheet" href="assets/vendor/css/core.css" />
    <link rel="stylesheet" href="assets/vendor/css/theme-default.css" />
    <link rel="stylesheet" href="assets/css/demo.css" />
    <link rel="stylesheet" href="assets/vendor/libs/apex-charts/apex-charts.css" />

    <link rel="stylesheet" href="css/app.css" />
    <!-- No .razor.css files in the project, so no scoped-CSS bundle is generated —
         linking HrmSystem.Client.styles.css would 404 into the SPA fallback (MIME error). -->
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="d-flex flex-column align-items-center justify-content-center" style="height: 100vh;">
            <div class="spinner-border text-primary" role="status"></div>
            <div class="mt-3 text-muted">Loading HrmSystem…</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- ApexCharts global consumed by js/apex-interop.js -->
    <script src="assets/vendor/libs/apex-charts/apexcharts.js"></script>
    <script>
        /* Chat thread autoscroll — called by ChatPage after messages render. */
        window.chatScrollToBottom = function (elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.scrollTop = el.scrollHeight;
            }
        };
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
